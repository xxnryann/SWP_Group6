# ---- Database (SQL Server) ----
# Database name must match the script sql/new.sql
db.url=jdbc:sqlserver://localhost:1433;databaseName=CinemaWebDB;encrypt=true;trustServerCertificate=true
db.user=sa
db.password=123

# ---- Media upload (poster/trailer). Dung duong dan tuyet doi de khong mat file khi redeploy ----
media.upload.root=D:/SWP26/SWP_Group6/media

# ---- Email (OTP). Leave mail.host empty => OTP is printed to the Tomcat console (dev mode) ----
mail.host=
mail.port=587
mail.user=
mail.password=
mail.from=no-reply@cinema.local

# ---- OTP ----
otp.ttl.minutes=5
otp.max.attempts=5

# ---- Payment gateway (VNPAY 2.1.0) ----
# Khi chua co vnpay.secretKey (hoac dat vnpay.mockGateway=true) he thong
# tu chuyen sang cong gia lap noi bo /mock/payment de chay duoc o moi truong.
vnpay.partnerCode=
vnpay.secretKey=
vnpay.mockGateway=true
vnpay.paymentUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.bankCode=
vnpay.mockPaymentUrl=/mock/payment
